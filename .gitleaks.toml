# gitleaks configuration, read automatically from the repository root.
# Docs: https://github.com/gitleaks/gitleaks/blob/v8.30.1/README.md
#
# Keep every built-in rule and allowlist; only add the narrow exceptions below.
[extend]
useDefault = true

# A committed recording stores its cache key as `"key": "<sha256 hex>"`: a
# digest of the request, not a credential. generic-api-key flags it (keyword
# "key", value long and high-entropy). JSON takes no "gitleaks:allow" comment,
# and a .gitleaksignore fingerprint carries the commit SHA, which a squash
# merge changes, so the exception lives here.
#
# Narrow on purpose (all three must hold, condition AND): only this rule, only
# recording files, and only a value that is exactly a 64-char lowercase hex
# digest. Every other rule still scans these files, and any other value under
# "key" is still reported.
[[allowlists]]
description = "SHA-256 cache keys in committed recordings"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^demo/recordings/[0-9a-f]{64}\.json$''']
regexes = ['''^[0-9a-f]{64}$''']
