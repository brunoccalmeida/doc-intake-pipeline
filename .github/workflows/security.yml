name: Security

# Pull requests and pushes to main run this audit through the CI workflow, as
# a dependency of its ci-passed gate.
on:
  workflow_call:
  # Advisories are published without any change to our code: an unchanged
  # uv.lock can become vulnerable overnight, so audit it daily too.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# No concurrency here: when called, github.workflow is the caller's name, so
# this group would be the caller's own and could cancel it.

permissions:
  contents: read

jobs:
  # A second vulnerability source next to Dependabot: uv audit queries OSV,
  # whose content and timing differ from GitHub's advisory database. It reads
  # uv.lock directly, so it audits exactly what "uv sync --locked" installs.
  #
  # uv audit is experimental in uv 0.13.9 ("may change without warning"). The
  # risk is accepted on purpose: uv is pinned ([tool.uv] required-version), so
  # its interface changes only in a uv bump PR, which runs this same job. The
  # flag acknowledges the preview instead of printing the warning on every run.
  #
  # Policy: any known vulnerability fails the job. To accept one, add
  # "--ignore <ID>" (or "--ignore-until-fixed <ID>") below with a comment
  # stating why and the issue that tracks its removal. Never continue-on-error.
  uv-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command

      # The demo's voice-over script has its own lock (demo/voice.py.lock,
      # PEP 723), which Dependabot does not read: this is its only audit.
      - name: Audit the voice-over script's dependencies
        run: uv audit --script demo/voice.py --locked --preview-features audit-command
