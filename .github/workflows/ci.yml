name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its previous run. head_ref is empty outside a PR,
# so run_id gives each of those runs its own group: a push to main is never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege: read-only by default; a job that needs more asks for it.
permissions:
  contents: read

# Timeouts: ~3x the slowest observed run, with a 5 min floor. First runs
# (#1, cold cache): every job took 10 s or less, so all sit at the floor.
jobs:
  # Lint, format and strict types: the same "uv run poe check" as locally,
  # so "check passed" means one thing on every machine.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # uv version comes from [tool.uv] required-version in pyproject.toml;
      # Python from .python-version (uv sync downloads it if missing).
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date with pyproject.toml instead
      # of silently resolving new versions in CI.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint, format and types
        run: uv run poe check

      # The example units in deploy/. verify reports unknown sections and keys
      # and an ExecStart binary missing on this machine, so uv goes where the
      # units expect it (deploy/README.md). Without --recursive-errors it
      # exits 0 even when it prints warnings (systemd-analyze(1)).
      - name: Verify the systemd units
        run: |
          sudo ln -sf "$(command -v uv)" /usr/local/bin/uv
          systemd-analyze verify --recursive-errors=yes --man=no \
            deploy/doc-intake-inbox.service deploy/doc-intake-inbox.timer

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The tesserocr wheel bundles the Tesseract engine, so no apt package is
      # needed; only the language model is downloaded, pinned by commit and
      # SHA-256 (scripts/fetch_tessdata.py). Without it the OCR tests fail.
      - name: Fetch OCR language data
        run: uv run poe fetch-tessdata

      # Our annotation of the amounts SROIE does not annotate quotes the
      # receipts, so it lives in the private recordings repository (#66,
      # docs/DATA.md), and fetch-golden reads it from there: checked out
      # first, as in the eval job below.
      - name: Read the pinned recordings commit
        id: pin
        run: |
          echo "repository=$(jq -r .repository evals/recordings.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit evals/recordings.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout recordings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .cache/recordings
          ssh-key: ${{ secrets.RECORDINGS_DEPLOY_KEY }}
          persist-credentials: false

      # SROIE has no published licence, so the golden set is not in Git: the
      # 20 receipts are downloaded from a pinned mirror commit and checked
      # against the SHA-256 in evals/golden/sroie.json (docs/DATA.md). Without
      # them the golden-set tests fail.
      - name: Fetch golden set
        run: uv run poe fetch-golden

      # No API key exists in this workflow: unit tests use a fake provider
      # (AGENTS.md invariant 4), so a test that reaches the network fails.
      - name: Run tests
        run: uv run pytest

  # The eval gate (docs/ARCHITECTURE.md D4): replays recorded provider
  # responses over each golden set, with no API key and no cost, and fails if
  # any field scores below its baseline (evals/baseline.json for SROIE,
  # evals/baseline-fatura.json for FATURA). The FATURA invoices and their
  # recordings are CC BY 4.0 and committed (docs/DATA.md). The recordings quote SROIE
  # receipts (no licence), so they live in a private repository, checked out
  # at the commit pinned in evals/recordings.json with a read-only deploy key
  # (also a Dependabot secret, since Dependabot PRs cannot read Actions
  # secrets). A PR from a fork has no secret and fails here: by design.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch OCR language data
        run: uv run poe fetch-tessdata

      # The pin is validated by tests/test_recording.py (owner/repo, 40-hex SHA).
      - name: Read the pinned recordings commit
        id: pin
        run: |
          echo "repository=$(jq -r .repository evals/recordings.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit evals/recordings.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout recordings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .cache/recordings
          ssh-key: ${{ secrets.RECORDINGS_DEPLOY_KEY }}
          persist-credentials: false

      # After the recordings: the golden amounts are read from that clone (#66).
      - name: Fetch golden set
        run: uv run poe fetch-golden

      - name: Run the eval
        run: uv run poe eval

      # Runs even when the receipts fail, so both reports show what broke.
      - name: Run the invoice eval
        if: ${{ !cancelled() }}
        run: uv run poe eval --suite fatura

      # The report holds ids, field names and outcomes only (evals/report.py),
      # so it can be public. Published even when the gate fails: that is when
      # it is needed.
      - name: Publish the report as the job summary
        if: ${{ !cancelled() }}
        run: |
          for report in .cache/eval/report.md .cache/eval/report-fatura.md; do
            if [ -f "$report" ]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-report
          path: |
            .cache/eval/report.md
            .cache/eval/report-fatura.md
          if-no-files-found: warn

  # The delivery kit and client repositories install the core's wheel from a
  # git tag (docs/ARCHITECTURE.md D18), not the repository: build it and check
  # it in an environment that has only the wheel, outside the project, so
  # src/ cannot mask a missing file (scripts/check_wheel.py).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          enable-cache: true

      - name: Build the wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"

      - name: Check the wheel and import it
        run: |
          wheel=$(ls "$RUNNER_TEMP"/dist/*.whl)
          uv run --isolated --no-project --with "$wheel" python -m scripts.check_wheel "$wheel"

  # Secret scanning with gitleaks over the history of the tested commit (on a
  # PR, the merge commit: what main would become). A key pushed to a public
  # repository is leaked even if a later commit deletes it, so every commit is
  # scanned, not only the last one. The MIT binary instead of gitleaks-action
  # (whose licence needs a registered key for organisations), pinned by
  # version and SHA-256 from the release's checksums file; Dependabot does not
  # track it, so bump both by hand.
  #
  # False positive: a "gitleaks:allow" comment on the line; in a file that
  # takes no comments (JSON), a narrow allowlist in .gitleaks.toml (one rule,
  # one path, one value shape). A real secret is rotated first, then removed. --redact keeps a found secret out of this
  # public run's log.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth 0: a shallow clone holds one commit, so a secret added
      # and deleted within the PR would go unseen.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # --log-opts=HEAD: without it gitleaks scans "git log --all", and a
      # secret on any other branch would fail every PR. Exits 1 on any leak.
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --verbose .'

  # Security audit of the workflows and dependabot.yml (template injection,
  # excessive permissions, persisted credentials, actions not pinned by SHA,
  # Dependabot cooldown). Run locally with "uvx zizmor@1.32.0 ." for the same
  # result. Ignore a finding only inline, with a reason.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false prints findings and fails the job; true would
      # upload SARIF and always pass, which ci-passed could not see. version is
      # pinned so a new zizmor release cannot fail a PR that changed nothing;
      # Dependabot bumps the action, not this input.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.32.0

  # Known vulnerabilities in uv.lock (security.yml, also run daily). Called
  # here so a vulnerable dependency fails ci-passed, the one required check.
  # $/: GitHub's self-repository syntax (July 2026), the same commit as this
  # run; "./" resolves against the runtime filesystem (zizmor self-repository).
  dependency-audit:
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read

  # deploy/README.md run as written on a machine with systemd (#61): "check"
  # verifies the unit files, this runs the install steps a client follows
  # (service user, uv, sync, OCR model, units) and starts the service.
  # scripts/readme_block.py extracts the README's blocks, under the
  # set -euo pipefail the README tells a client to use (plus -x, for this
  # log). Every other difference from a client's machine is declared below,
  # and the job fails when its text is no longer in the README, so CI never
  # runs a stale copy. No paid
  # call: the API key is a dummy the provider refuses.
  #
  # Two machines, two ways uv finds Python: ubuntu-latest (26.04) ships the
  # Python 3.14 of .python-version, so uv uses it; ubuntu-24.04 does not, so
  # uv downloads one into the home of whoever runs the install. Only the
  # second shows an install as root breaking the service (#61).
  deploy-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The commit under test instead of the release tag (which a PR has not
      # published yet), and a dummy key instead of an editor.
      - name: Read the install steps from deploy/README.md
        env:
          README_CLONE: sudo git clone --branch v0.2.0 --depth 1 https://github.com/brunoccalmeida/doc-intake-pipeline
          CI_CLONE: sudo git clone --depth 1 "file://$GITHUB_WORKSPACE"
          README_EDIT: "sudoedit .env    # the API key and any DOC_INTAKE_* setting"
          CI_EDIT: sudo sed -i 's/^DOC_INTAKE_ANTHROPIC_API_KEY=$/DOC_INTAKE_ANTHROPIC_API_KEY=not-a-real-key/' .env
        run: >-
          python3 scripts/readme_block.py deploy/README.md "## Install"
          --replace "$README_CLONE" "$CI_CLONE"
          --replace "$README_EDIT" "$CI_EDIT"
          > "$RUNNER_TEMP/install.sh"

      # Ends with the README's "Check it" block: one run over the empty inbox,
      # which must exit 0.
      - name: Install and check it, as the README says
        run: bash "$RUNNER_TEMP/install.sh"

      # The service runs this binary: an owner other than root could swap it.
      - name: uv is owned by root
        run: test "$(stat -c %u:%g /usr/local/bin/uv)" = 0:0

      - name: An empty inbox is a successful run
        run: |
          test "$(systemctl show -p Result --value doc-intake-inbox.service)" = success
          sudo journalctl -u doc-intake-inbox.service --no-pager | grep "nothing ready in the inbox"

      # Backdated past the 60 s settle window instead of waiting for it.
      # Exit 1 alone could be any failure (no Python, no permission): the
      # results.csv row naming the provider's refusal proves the run reached
      # the provider as the service user. The timer is stopped meanwhile: a
      # run it started would reset Result before it is read.
      - name: A provider error leaves the document in the inbox
        run: |
          sudo systemctl stop doc-intake-inbox.timer
          sudo install -o doc-intake -g doc-intake -m 644 demo/receipt.png /srv/doc-intake/inbox/receipt.png
          sudo touch -d '-2 min' /srv/doc-intake/inbox/receipt.png
          if sudo systemctl start doc-intake-inbox.service; then
            echo "::error::the run succeeded with a dummy API key"
            exit 1
          fi
          test "$(systemctl show -p Result --value doc-intake-inbox.service)" = exit-code
          test "$(systemctl show -p ExecMainStatus --value doc-intake-inbox.service)" = 1
          sudo test -f /srv/doc-intake/inbox/receipt.png
          sudo sh -c 'grep AuthenticationError /srv/doc-intake/runs/*/results.csv'
          sudo systemctl start doc-intake-inbox.timer

      - name: The timer is scheduled
        run: |
          systemctl is-enabled doc-intake-inbox.timer
          systemctl is-active doc-intake-inbox.timer
          systemctl list-timers --no-pager doc-intake-inbox.timer | grep doc-intake-inbox.timer

      - name: Show the service log
        if: ${{ failure() }}
        run: sudo journalctl -u doc-intake-inbox.service --no-pager

  # The single required check (ruleset on main). always(): a skipped required
  # check counts as passed, so the gate must run, and fail, when a dependency
  # fails. A new job must be added to "needs"; tests/test_ci_gate.py enforces it.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, test, eval, package, deploy-smoke, secret-scan, workflow-audit, dependency-audit]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require every job to succeed
        run: python3 scripts/check_needs.py
        env:
          NEEDS: ${{ toJSON(needs) }}
