name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its previous run. head_ref is empty outside a PR,
# so run_id gives each of those runs its own group: a push to main is never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Least privilege: read-only by default; a job that needs more asks for it.
permissions:
  contents: read

# Timeouts: ~3x the slowest observed run, with a 5 min floor. First runs
# (#1, cold cache): every job took 10 s or less, so all sit at the floor.
jobs:
  # Lint, format and strict types: the same "uv run poe check" as locally,
  # so "check passed" means one thing on every machine.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # uv version comes from [tool.uv] required-version in pyproject.toml;
      # Python from .python-version (uv sync downloads it if missing).
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      # --locked: fail if uv.lock is out of date with pyproject.toml instead
      # of silently resolving new versions in CI.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint, format and types
        run: uv run poe check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # The tesserocr wheel bundles the Tesseract engine, so no apt package is
      # needed; only the language model is downloaded, pinned by commit and
      # SHA-256 (scripts/fetch_tessdata.py). Without it the OCR tests fail.
      - name: Fetch OCR language data
        run: uv run poe fetch-tessdata

      # SROIE has no published licence, so the golden set is not in Git: the
      # 20 receipts are downloaded from a pinned mirror commit and checked
      # against the SHA-256 in evals/golden/sroie.json (docs/DATA.md). Without
      # them the golden-set tests fail.
      - name: Fetch golden set
        run: uv run poe fetch-golden

      # No API key exists in this workflow: unit tests use a fake provider
      # (AGENTS.md invariant 4), so a test that reaches the network fails.
      - name: Run tests
        run: uv run pytest

  # The eval gate (docs/ARCHITECTURE.md D4): replays recorded provider
  # responses over the golden set, with no API key and no cost, and fails if
  # any field scores below evals/baseline.json. The recordings quote SROIE
  # receipts (no licence), so they live in a private repository, checked out
  # at the commit pinned in evals/recordings.json with a read-only deploy key
  # (also a Dependabot secret, since Dependabot PRs cannot read Actions
  # secrets). A PR from a fork has no secret and fails here: by design.
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch OCR language data
        run: uv run poe fetch-tessdata

      - name: Fetch golden set
        run: uv run poe fetch-golden

      # The pin is validated by tests/test_recording.py (owner/repo, 40-hex SHA).
      - name: Read the pinned recordings commit
        id: pin
        run: |
          echo "repository=$(jq -r .repository evals/recordings.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit evals/recordings.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout recordings
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .cache/recordings
          ssh-key: ${{ secrets.RECORDINGS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Run the eval
        run: uv run poe eval

      # The report holds ids, field names and outcomes only (evals/report.py),
      # so it can be public. Published even when the gate fails: that is when
      # it is needed.
      - name: Publish the report as the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f .cache/eval/report.md ]; then
            cat .cache/eval/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: eval-report
          path: .cache/eval/report.md
          if-no-files-found: warn

  # Secret scanning with gitleaks over the history of the tested commit (on a
  # PR, the merge commit: what main would become). A key pushed to a public
  # repository is leaked even if a later commit deletes it, so every commit is
  # scanned, not only the last one. The MIT binary instead of gitleaks-action
  # (whose licence needs a registered key for organisations), pinned by
  # version and SHA-256 from the release's checksums file; Dependabot does not
  # track it, so bump both by hand.
  #
  # False positive: a "gitleaks:allow" comment on the line; in a file that
  # takes no comments (JSON), a narrow allowlist in .gitleaks.toml (one rule,
  # one path, one value shape). A real secret is rotated first, then removed. --redact keeps a found secret out of this
  # public run's log.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # fetch-depth 0: a shallow clone holds one commit, so a secret added
      # and deleted within the PR would go unseen.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      # --log-opts=HEAD: without it gitleaks scans "git log --all", and a
      # secret on any other branch would fail every PR. Exits 1 on any leak.
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts=HEAD --redact --verbose .'

  # Security audit of the workflows and dependabot.yml (template injection,
  # excessive permissions, persisted credentials, actions not pinned by SHA,
  # Dependabot cooldown). Run locally with "uvx zizmor@1.32.0 ." for the same
  # result. Ignore a finding only inline, with a reason.
  workflow-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # advanced-security: false prints findings and fails the job; true would
      # upload SARIF and always pass, which ci-passed could not see. version is
      # pinned so a new zizmor release cannot fail a PR that changed nothing;
      # Dependabot bumps the action, not this input.
      - name: Audit the workflows
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd  # v0.8.1
        with:
          advanced-security: false
          annotations: true
          version: 1.32.0

  # Known vulnerabilities in uv.lock (security.yml, also run daily). Called
  # here so a vulnerable dependency fails ci-passed, the one required check.
  # $/: GitHub's self-repository syntax (July 2026), the same commit as this
  # run; "./" resolves against the runtime filesystem (zizmor self-repository).
  dependency-audit:
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read

  # The single required check (ruleset on main). always(): a skipped required
  # check counts as passed, so the gate must run, and fail, when a dependency
  # fails. A new job must be added to "needs"; tests/test_ci_gate.py enforces it.
  ci-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [check, test, eval, secret-scan, workflow-audit, dependency-audit]
    if: ${{ always() }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require every job to succeed
        run: python3 scripts/check_needs.py
        env:
          NEEDS: ${{ toJSON(needs) }}
