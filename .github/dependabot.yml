# Dependabot version updates.
# Grouped to limit work in progress: each open PR goes stale whenever another
# merges (main requires up-to-date branches), so fewer PRs means fewer CI
# cycles and reviews. Majors match no group, so each gets its own PR and a
# breaking change is easy to isolate. Security updates are enabled in the
# repository settings and ignore the cooldown (a fix must not wait).
#
# Cooldown: a compromised release is usually taken down within days, so
# version updates wait 7 days (zizmor's dependabot-cooldown audit, run by the
# workflow-audit job, checks it).
version: 2
updates:
  # Reads pyproject.toml and updates uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Low risk and reviewed together: one PR for all actions
      github-actions:
        patterns: ["*"]
