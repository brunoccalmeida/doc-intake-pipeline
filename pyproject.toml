[project]
name = "doc-intake-pipeline"
version = "0.2.0"
description = "LLM document intake pipeline with source citations, schema validation and per-field evals gating CI"
readme = "README.md"
license = "MIT"
# Consumers install the built wheel, not the repository, and MIT requires the
# notice in every copy (docs/ARCHITECTURE.md D18): the wheel carries it in
# .dist-info/licenses/ (PEP 639).
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.10.0",
    "openai>=3.55.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "tesserocr>=2.13.0",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
# The delivery kit and client repositories install the core as a git
# dependency pinned to a tag (docs/ARCHITECTURE.md D18). The upper bound keeps
# a future backend release from changing how a tagged version builds.
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# One uv version for every machine: setup-uv in CI reads this same field
# (its "version" input defaults to the version in pyproject.toml).
required-version = "==0.13.9"

[tool.uv.build-backend]
# The import name differs from the distribution name (doc-intake-pipeline would
# default to doc_intake_pipeline). The module lives in src/ (the default
# module-root), so only what is meant to ship is importable from the install.
module-name = "doc_intake"

[tool.pytest]
# pytest 9 reads native TOML here (no ini_options table needed).
testpaths = ["tests"]
# doc_intake is installed (editable) by uv sync. The development tooling that
# does not ship (evals, scripts, demo) is imported from the project root.
pythonpath = ["."]
# Unknown markers and config keys are errors, not warnings (fail fast).
strict = true
addopts = ["-ra"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# Rule families beyond the default (E4, E7, E9, F), each catching a class of
# bug or inconsistency the type checker does not: imports (I), modern syntax
# (UP), likely bugs (B), simplifications (SIM, C4), pathlib over os.path (PTH),
# pytest style (PT), naming (N), security smells (S), banned imports (TID)
# and ruff's own (RUF).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PTH", "PT", "N", "S", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The engine depends on core.llm.LLMProvider, never on a vendor SDK
# (docs/ARCHITECTURE.md D2): only the providers package may import one.
"anthropic".msg = "import vendor SDKs only in doc_intake/providers/ (docs/ARCHITECTURE.md D2)"
"openai".msg = "import vendor SDKs only in doc_intake/providers/ (docs/ARCHITECTURE.md D2)"

[tool.ruff.lint.per-file-ignores]
# S101: pytest's assertion rewriting is how tests assert; outside tests a bare
# assert is stripped by "python -O" and must not guard anything.
"tests/**" = ["S101"]
# The one package allowed to import vendor SDKs (see banned-api above).
"src/doc_intake/providers/**" = ["TID251"]
# N802: stubs copy the third-party library's own method names (tesserocr's CamelCase).
"typings/**" = ["N802"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "evals", "scripts", "demo", "tests", "typings"]
# The voice-over script runs on its own Python 3.13 and lock (PEP 723,
# demo/voice.py.lock), whose packages (kokoro-onnx) do not install in this
# environment: pyright here could only report them missing. Ruff still lints it.
exclude = ["demo/voice.py"]
# Local stubs for libraries that ship no usable types (pypdfium2, tesserocr):
# pyright resolves stubPath before installed packages. Each stub holds only
# the API the project calls; see the header of each file.
stubPath = "typings"
venvPath = "."
venv = ".venv"
# A suppression that no longer suppresses anything is noise: report it.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.poe.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."
types = "pyright"
format = "ruff format ."
# Rewrite each pack's committed JSON Schema; a snapshot test fails until you do.
export-schemas = "python -m doc_intake.packs.json_schema"
# Download Tesseract's English model (pinned, checksum-verified) for OCR.
fetch-tessdata = "python -m scripts.fetch_tessdata"
# Download the SROIE golden set (pinned, checksum-verified) and convert it locally.
fetch-golden = "python -m scripts.fetch_golden"
# Extract one receipt with the configured real provider: a paid API call, except with --replay.
extract = "python -m scripts.extract_document"
# Score the golden set from recorded responses and gate on evals/baseline.json.
# "--record" calls the real provider for unrecorded requests: a paid API call.
eval = "python -m scripts.run_eval"
# One scheduled run over an inbox folder (deploy/): paid, except with --replay.
inbox = "python -m scripts.run_inbox"
# The delivered flow on the demo receipts, into .cache/inbox-demo: replay only, no cost.
inbox-demo = "python -m scripts.inbox_demo"
# Per field and source, the error rate of reviewed run folders and its 95% upper bound.
review-report = "python -m scripts.review_report"
# A client's acceptance policy from reviewed run folders: which image-read fields skip review.
calibrate = "python -m scripts.calibrate"
# Render the demo video (demo/README.md) into .cache/demo, in Docker: replay only, no cost.
demo-image = "docker build --file demo/Dockerfile --tag doc-intake-demo ."
demo-render = "docker run --rm --volume ${POE_ROOT}:/work doc-intake-demo uv run --locked python -m demo.render"
demo.sequence = ["demo-image", "demo-render"]
# Generate the voice-over clip of every new line (demo/narration.py), locally and
# free (Kokoro on CPU); the clips are committed, so the render never needs it.
demo-voice = "python -m demo.narration"
# Draw the spreadsheet image (demo/spreadsheet.png) from a replayed inbox run: no cost.
demo-sheet = "python -m demo.spreadsheet"
# The local gate, the same commands as CI's "check" job. Every step runs even
# after a failure, so one run reports every problem; the exit is still non-zero.
check.sequence = ["lint", "format-check", "types"]
check.ignore_fail = "return_non_zero"
